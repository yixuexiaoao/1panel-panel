# 测试通过后构建多架构镜像并推送到 Docker Hub。
# 需要 DOCKERHUB_USERNAME（Variables 或 Secrets）与 DOCKERHUB_TOKEN（建议放 Secrets；Docker Hub Access Token，需 Read & Write 权限）。
# 镜像：<DOCKERHUB_USERNAME>/1panel-panel，标签为 package.json 的 version 与 latest。
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    env:
      # 用户名放在 Variables 或 Secrets 均可；token 优先取 Secrets
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Docker Hub 配置
        env:
          TOKEN_IN_SECRETS: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          [ -n "$DOCKERHUB_USERNAME" ] || { echo "::error::缺少 DOCKERHUB_USERNAME（Variables 或 Secrets）"; exit 1; }
          [ -n "$DOCKERHUB_TOKEN" ] || { echo "::error::缺少 DOCKERHUB_TOKEN（应放在 Secrets）"; exit 1; }
          echo "::add-mask::$DOCKERHUB_TOKEN"
          [ "$TOKEN_IN_SECRETS" = "true" ] || echo "::warning::DOCKERHUB_TOKEN 放在 Variables 中是明文，任何有仓库读权限的人都能看到，请移到 Secrets"

      - name: 读取版本号
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/1panel-panel:${{ steps.meta.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/1panel-panel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
